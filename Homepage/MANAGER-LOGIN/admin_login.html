<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - PriFile</title>
  <link rel="stylesheet" href="/frontend/Homepage/MANAGER-LOGIN/admin_login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="logo">PriFile</h1>
      <!-- Form without action attribute, handled by JavaScript -->
      <form id="adminLoginForm">
        <h2>Manager</h2>

        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" required />

        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" required />

        <button type="submit" class="arrow-btn">➜</button>
      </form>
    </div>
  </div>

  <!-- Link to the JS file -->
  <script src="/frontend/Homepage/MANAGER-LOGIN/admin_login.js"></script>
</body>
</html>
