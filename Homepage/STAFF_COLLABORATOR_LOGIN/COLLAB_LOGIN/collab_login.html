<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collaborator Login - PriFile</title>
  <link rel="stylesheet" href="/frontend/Homepage/STAFF_COLLABORATOR_LOGIN/COLLAB_LOGIN/collab_login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="logo">PriFile</h1>
      <form id="CollaboratorLoginForm">
        <h2>Collaborator</h2>

        <label for="collaborator-email">Email</label>
        <input type="email" id="collaborator-email" required />

        <label for="collaborator-password">Password</label>
        <input type="password" id="collaborator-password" required />

        <button type="submit" class="arrow-btn">➜</button>
      </form>
    </div>
  </div>

  <script src="/frontend/Homepage/STAFF_COLLABORATOR_LOGIN/COLLAB_LOGIN/collab_login.js"></script>
</body>
</html>
