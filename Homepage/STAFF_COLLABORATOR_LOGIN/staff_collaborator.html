<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Login - PriFile</title>
  <link rel="stylesheet" href="/frontend/Homepage/STAFF_COLLABORATOR_LOGIN/staff.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="logo">PriFile</h1>
      <form id="staffLoginForm">
        <h2>Staff</h2>

        <label for="staff-email">Email</label>
        <input type="email" id="staff-email" required />

        <label for="staff-password">Password</label>
        <input type="password" id="staff-password" required />

        <button type="submit" class="arrow-btn">➜</button>
      </form>
    </div>
  </div>

  <!-- Link to external JavaScript file -->
  <script src="/frontend/Homepage/STAFF_COLLABORATOR_LOGIN/staff_collaborator.js"></script>
</body>
</html>
