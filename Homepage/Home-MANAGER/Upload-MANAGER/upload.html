<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload - PriFile</title>
  <link rel="stylesheet" href="upload.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.9-1-crypto-js.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="menu-icon">&#9776;</div>
    <h1 class="brand">PriFile</h1>
    <span class="user-text">Welcome, USER!</span>
  </header>

  <div class="upload-container">
    <h2 class="upload-title">UPLOAD FILE</h2>

    <form id="uploadForm" method="GET">
      <label for="fileName">File Name</label>
      <input type="text" id="fileName" placeholder="Enter file name" required>

      <label for="fileDesc">File Description</label>
      <input type="text" id="fileDesc" placeholder="Enter file description" required>

      <label for="fileInput">Select File <i class="fas fa-upload"></i></label>
      <input type="file" id="fileInput" required>

      <textarea id="filePreview" placeholder="File preview will appear here..." readonly></textarea>

      <button type="submit" class="upload-btn">UPLOAD</button>
    </form>
  </div>

  <script src="upload.js"></script>
</body>
</html>
