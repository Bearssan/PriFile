<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>
    <link rel="stylesheet" href="download.css">
    <script src="download.js" defer></script>
</head>
<body>
    <header>
        <div class="menu">&#9776; <span class="logo">PriFile</span></div>
        <div class="welcome">Welcome, USER!</div>
    </header>

    <div class="container">
        <h1>Download File</h1>
        
        <!-- Secret Key Input -->
        <div class="secret-key-form">
            <label for="secret-key">Insert Secret Key:</label>
            <input type="text" id="secret-key" placeholder="Enter secret key">
            <button id="submit-key">Submit</button>
        </div>

        <!-- Available Files Table -->
        <table id="file-table" style="display:none;">
            <thead>
                <tr>
                    <th>File Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="file-list">
                <!-- Files will be dynamically inserted here -->
            </tbody>
        </table>

        <!-- Home Button -->
        <button id="home-btn">Home</button>
    </div>

    <script>
        // Function to fetch files based on the secret key
        function fetchFile() {
            const secretKey = document.getElementById("secret-key").value;

            // Ensure the secret key is not empty
            if (!secretKey) {
                alert("Please enter a secret key.");
                return;
            }

            // Send the secret key to PHP via fetch API
            fetch("fetchFiles.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: `secret-key=${secretKey}`
            })
            .then(response => response.json())
            .then(data => {
                const fileTable = document.getElementById("file-table");
                const fileList = document.getElementById("file-list");

                // Clear previous file list
                fileList.innerHTML = "";

                if (data.success && data.files.length > 0) {
                    // Show the file table
                    fileTable.style.display = "block";

                    // Populate the table with available files
                    data.files.forEach(file => {
                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${file.name}</td>
                            <td>
                                <button class="download-btn" onclick="downloadFile('${file.url}')">Download</button>
                            </td>
                        `;
                        fileList.appendChild(row);
                    });
                } else {
                    alert("No files found or invalid secret key.");
                }
            })
            .catch(error => {
                console.error("Error fetching files:", error);
            });
        }

        // Download file function
        function downloadFile(url) {
            const link = document.createElement("a");
            link.href = url;
            link.download = url.split("/").pop(); // Extract filename from URL
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Home Button Click Event
        document.getElementById("home-btn").addEventListener("click", function () {
            window.location.href = "/Homepage/Home-MANAGER/manager.html"; // Adjust the path if needed
        });

        // Submit Secret Key and Fetch Files
        document.getElementById("submit-key").addEventListener("click", fetchFile);
    </script>
</body>
</html>
