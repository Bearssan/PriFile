<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File History</title>
    <link rel="stylesheet" href="filehistory.css">
    <script src="filehistory.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="menu" onclick="toggleNav()">
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
            <span class="menu-bar"></span>
        </div>
        <div class="logo">PriFile</div>
        <div class="welcome">Welcome, USER!</div>
    </header>

    <!-- Side Navigation -->
    <div id="side-nav" class="side-nav">
        <div class="close-btn" onclick="toggleNav()">&#8594;</div>
        <h2>PriFile</h2>
        <ul>
            <li><a href="/frontend/Homepage/Home-MANAGER/FileHistory-MANAGER/filehistory.html">File History</a></li>
            <li><a href="/frontend/Homepage/Home-MANAGER/Staff-MANAGER/staff.html">Staff</a></li>
            <li><a href="/frontend/Homepage/Home-MANAGER/Collaborator/collaborator.html">Collaborator</a></li>
            
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h1>FILE HISTORY</h1>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>File Name</th>
                    <th>Date</th>
                    <th>Activity</th>
                </tr>
            </thead>
            <tbody id="history-table">
                <!-- Data will be inserted dynamically -->
            </tbody>
        </table>

        <button id="home-btn">HOME</button>
    </div>

    <!-- JavaScript -->
    <script>
        // Toggle side navigation
        function toggleNav() {
            const sideNav = document.getElementById('side-nav');
            const menu = document.querySelector('.menu');

            if (sideNav.style.left === "0px") {
                sideNav.style.left = "-250px";
                menu.classList.remove("opened");
            } else {
                sideNav.style.left = "0";
                menu.classList.add("opened");
            }
        }

        // Load file history data
        document.addEventListener("DOMContentLoaded", () => {
            fetchFileHistory();
        });

        function fetchFileHistory() {
            // Example static data, replace with actual data fetching logic
            const data = [
                { no: 1, fileName: 'Document 1', date: '2025-04-01', activity: 'Uploaded' },
                { no: 2, fileName: 'Document 2', date: '2025-04-02', activity: 'Deleted' },
                { no: 3, fileName: 'Document 3', date: '2025-04-03', activity: 'Updated' }
            ];

            const tableBody = document.getElementById('history-table');
            tableBody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.no}</td>
                    <td>${item.fileName}</td>
                    <td>${item.date}</td>
                    <td>${item.activity}</td>
                `;
                tableBody.appendChild(row);
            });
        }
    </script>

</body>
</html>
